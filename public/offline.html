<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>غير متصل · خَيال</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fafaf9; color: #1c1917; text-align: center; padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #0c0a09; color: #fafaf9; } }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px;
        display: grid; place-items: center; font-size: 26px; font-weight: 700; color: #fff;
        background: linear-gradient(135deg, #a855f7, #7e22ce);
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0; opacity: .7; font-size: 15px; line-height: 1.7; }
      button {
        margin-top: 22px; height: 44px; padding: 0 22px; border: 0; border-radius: 12px;
        background: #9333ea; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">خ</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>تحقّق من اتصالك ثم أعد المحاولة — محفوظاتك وبياناتك ستبقى كما هي.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
